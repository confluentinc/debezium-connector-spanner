version: v1.0
name: build-test-release
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-1

fail_fast:
  cancel:
    when: "true"

execution_time_limit:
  hours: 2

queue:
  - when: "branch = 'release-3.6.0.Final-confluent'"
    processing: parallel

global_job_config:
  prologue:
    commands:
      - checkout
      - sem-version java 21
      - . cache-maven restore

blocks:
  - name: 'Build, Test, Release'
    dependencies: []
    run:
      when: "branch = 'release-3.6.0.Final-confluent' and (change_in('/', {default_branch: 'upstream-main'}) or change_in('.semaphore/', {default_branch: 'upstream-main'}))"
    task:
      jobs:
        - name: 'Build, test, and publish to CodeArtifact'
          commands:
            - ./mvnw -U -Dmaven.wagon.http.retryHandler.count=10 --batch-mode clean install -DskipITs
            - export BUILT_VERSION=$(ls target/debezium-connector-spanner-*.jar | grep -v '\(sources\|javadoc\|tests\)' | head -1 | sed 's|.*/debezium-connector-spanner-\(.*\)\.jar|\1|')
            - export CONNECTOR_VERSION=3.6.0.Final-1
            - echo "Built as ${BUILT_VERSION}, deploying as version - ${CONNECTOR_VERSION}"
            - |
              if [ -z "$BUILT_VERSION" ]; then
                echo "ERROR: Could not determine version from built artifacts"
                ls -la target/
                exit 1
              fi
            - ./mvnw deploy:deploy-file
              -Durl=https://confluent-519856050701.d.codeartifact.us-west-2.amazonaws.com/maven/maven-snapshots/
              -DrepositoryId=confluent-codeartifact-internal
              -Dfile=target/debezium-connector-spanner-${BUILT_VERSION}.jar
              -DpomFile=pom.xml
              -DgroupId=io.confluent
              -DartifactId=debezium-connector-spanner
              -Dversion=${CONNECTOR_VERSION}
              -Dpackaging=jar
            - ./mvnw deploy:deploy-file
              -Durl=https://confluent-519856050701.d.codeartifact.us-west-2.amazonaws.com/maven/maven-snapshots/
              -DrepositoryId=confluent-codeartifact-internal
              -Dfile=target/debezium-connector-spanner-${BUILT_VERSION}-sources.jar
              -DgeneratePom=false
              -DgroupId=io.confluent
              -DartifactId=debezium-connector-spanner
              -Dversion=${CONNECTOR_VERSION}
              -Dpackaging=jar
              -Dclassifier=sources
            - ./mvnw deploy:deploy-file
              -Durl=https://confluent-519856050701.d.codeartifact.us-west-2.amazonaws.com/maven/maven-snapshots/
              -DrepositoryId=confluent-codeartifact-internal
              -Dfile=target/debezium-connector-spanner-${BUILT_VERSION}-tests.jar
              -DgeneratePom=false
              -DgroupId=io.confluent
              -DartifactId=debezium-connector-spanner
              -Dversion=${CONNECTOR_VERSION}
              -Dpackaging=jar
              -Dclassifier=tests
